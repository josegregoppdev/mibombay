# ============================================
# application-prod.properties
# Perfil: producción
# Se sube al repo. NO contiene secretos.
# TODOS los valores sensibles deben venir de variables de entorno.
# ============================================

# === DataSource (obligatorio via env vars, sin defaults) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# === JPA sin logs SQL (performance) ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# === Thymeleaf con cache (performance) ===
spring.thymeleaf.cache=true

# === DevTools deshabilitado en prod ===
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# === Pool de conexiones optimizado ===
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# === Logging INFO/WARN (no DEBUG) ===
logging.level.com.mibombay=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# === Server (recomendado detrás de proxy) ===
server.tomcat.max-threads=200
server.tomcat.accept-count=100
