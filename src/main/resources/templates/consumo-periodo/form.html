<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:replace="~{fragments/layout :: layout(template=~{::template})}">
<body>
<div th:fragment="template">
    <div class="sd-page-header sd-fade sd-fade--1">
        <div>
            <h1 class="sd-page-title" th:text="'Consumo ' + (${periodo.tipo == 'SEMANAL'} ? 'Semanal' : 'Mensual')"></h1>
            <p class="sd-page-desc" th:text="${#temporals.format(periodo.fechaInicio, 'dd/MM/yyyy')} + ' — ' + ${#temporals.format(periodo.fechaFin, 'dd/MM/yyyy')}"></p>
            <div class="sd-title-accent"></div>
        </div>
    </div>

    <form th:action="@{/admin/consumo-periodo/{id}/guardar(id=${periodo.id})}" method="post"
          class="sd-fade sd-fade--2">
        <div class="sd-section-card">
            <div class="sd-list-card-header">
                <span class="sd-list-card-title">
                    <i class="bi bi-box"></i> Inventario Consumibles
                </span>
                <span class="sd-muted" th:text="${#lists.size(detalles)} + ' items'"></span>
            </div>
            <div class="sa-table-wrapper">
                <table class="sa-table">
                    <thead>
                        <tr>
                            <th>Ingrediente</th>
                            <th class="sa-cell-center">Stock Sistema</th>
                            <th class="sa-cell-center">Merma</th>
                            <th class="sa-cell-center">Desperdicio</th>
                            <th class="sa-cell-center">Stock Final</th>
                            <th class="sa-cell-center" style="color:var(--accent,#d4a853);">Consumido (calc)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d, iter : ${detalles}" class="sd-table-row">
                            <td th:text="${d.itemNombre}"></td>
                            <td class="sa-cell-center sd-stock-value" th:text="${d.stockSistema}"></td>
                            <td class="sa-cell-center">
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemTipo'" th:value="${d.itemTipo}" />
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemId'" th:value="${d.itemId}" />
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].merma'"
                                       th:value="${d.merma}"
                                       class="sd-filter-input sd-input-consumo" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].desperdicio'"
                                       th:value="${d.desperdicio}"
                                       class="sd-filter-input sd-input-consumo" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].stockFinal'"
                                       th:value="${d.stockFinal}"
                                       class="sd-filter-input sd-input-consumo"
                                       style="font-weight:700;border-color:var(--accent,#d4a853);" />
                            </td>
                            <td class="sa-cell-center sd-stock-value sd-consumo-calc"
                                th:data-sistema="${d.stockSistema}"
                                data-default="0">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div style="display:flex;gap:0.75rem;justify-content:flex-end;padding:1rem 0 0;flex-wrap:wrap;">
                <a th:href="@{/admin/consumo-periodo}" class="sd-btn sd-btn--outline">Cancelar</a>
                <button type="submit" class="sd-btn">
                    <i class="bi bi-save"></i> Guardar Borrador
                </button>
                <button type="submit" th:formaction="@{/admin/consumo-periodo/{id}/confirmar(id=${periodo.id})}"
                        th:formmethod="post" class="sd-btn sd-btn--success"
                        onclick="return confirm('¿Confirmar inventario? Se descontar\u00e1 del stock: consumido + merma + desperdicio. No se podr\u00e1 modificar.');">
                    <i class="bi bi-check-circle"></i> Confirmar
                </button>
            </div>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.sd-input-consumo').forEach(function(input) {
        input.addEventListener('input', function() {
            var row = this.closest('tr');
            if (!row) return;
            var sistemaTd = row.querySelector('td.sd-stock-value');
            if (!sistemaTd) return;
            var stockSistema = parseFloat(sistemaTd.textContent.trim()) || 0;
            var inputs = row.querySelectorAll('.sd-input-consumo');
            var merma = 0, desperdicio = 0, stockFinal = 0;
            inputs.forEach(function(inp) {
                var val = parseFloat(inp.value) || 0;
                var name = inp.getAttribute('name') || '';
                if (name.indexOf('merma') >= 0) merma = val;
                else if (name.indexOf('desperdicio') >= 0) desperdicio = val;
                else if (name.indexOf('stockFinal') >= 0) stockFinal = val;
            });
            var consumido = stockSistema - stockFinal - merma - desperdicio;
            if (consumido < 0) consumido = 0;
            var calcTd = row.querySelector('.sd-consumo-calc');
            if (calcTd) calcTd.textContent = consumido.toFixed(3);
        });
    });
});
</script>

<style>
.sa-table { min-width: 700px; }
.sd-input-consumo { width: 90px; text-align: center; }
.sd-consumo-calc { color: var(--accent, #d4a853); font-weight: 700; }
</style>
</body>
</html>
