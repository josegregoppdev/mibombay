<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:replace="~{fragments/layout :: layout(template=~{::template})}">
<body>
<div th:fragment="template">
    <div class="sd-page-header sd-fade sd-fade--1">
        <div>
            <h1 class="sd-page-title">Cargar Inventario F&iacute;sico</h1>
            <p class="sd-page-desc">
                <span th:text="${#temporals.format(inventario.fecha, 'dd/MM/yyyy')}"></span> &middot;
                Ingresa el stock f&iacute;sico contado, merma y desperdicio de cada item
            </p>
            <div class="sd-title-accent"></div>
        </div>
        <div class="sd-page-actions">
            <a th:href="@{/inventario-fisico}" class="sd-btn sd-btn--outline">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <form th:action="@{/inventario-fisico/guardar}" method="post" th:object="${form}">
        <input type="hidden" th:field="*{inventarioId}" />

        <div class="sd-section-card sd-fade sd-fade--2">
            <div class="sd-list-card-header">
                <span class="sd-list-card-title">
                    <i class="bi bi-box-seam"></i> Ingredientes
                </span>
                <span class="sd-muted" th:text="${detalles.?[itemTipo == 'INGREDIENTE'].size()} + ' items'"></span>
            </div>
            <div class="sa-table-wrapper">
                <table class="sa-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Unidad</th>
                            <th class="sa-cell-center">Stock Sistema</th>
                            <th class="sa-cell-center">Stock F&iacute;sico</th>
                            <th class="sa-cell-center">Merma</th>
                            <th class="sa-cell-center">Desperdicio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d, iter : ${detalles}"
                            th:if="${d.itemTipo == 'INGREDIENTE'}"
                            class="sd-table-row">
                            <td th:text="${d.itemNombre}"></td>
                            <td><span class="sd-unit-badge" th:text="${d.unidadMedida}"></span></td>
                            <td class="sa-cell-center sd-stock-value" th:text="${d.stockSistema}"></td>
                            <td class="sa-cell-center">
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemId'"
                                       th:value="${d.itemId}" />
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemTipo'"
                                       th:value="${d.itemTipo}" />
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].stockFisico'"
                                       th:value="${d.stockFisico != null ? d.stockFisico : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:100px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].merma'"
                                       th:value="${d.merma != null ? d.merma : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:80px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].desperdicio'"
                                       th:value="${d.desperdicio != null ? d.desperdicio : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:80px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="sd-section-card sd-fade sd-fade--3" style="margin-top:1rem;">
            <div class="sd-list-card-header">
                <span class="sd-list-card-title">
                    <i class="bi bi-cup-hot"></i> Productos (sin receta)
                </span>
                <span class="sd-muted" th:text="${detalles.?[itemTipo == 'PRODUCTO'].size()} + ' items'"></span>
            </div>
            <div class="sa-table-wrapper">
                <table class="sa-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Unidad</th>
                            <th class="sa-cell-center">Stock Sistema</th>
                            <th class="sa-cell-center">Stock F&iacute;sico</th>
                            <th class="sa-cell-center">Merma</th>
                            <th class="sa-cell-center">Desperdicio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d, iter : ${detalles}"
                            th:if="${d.itemTipo == 'PRODUCTO'}"
                            class="sd-table-row">
                            <td th:text="${d.itemNombre}"></td>
                            <td><span class="sd-unit-badge" th:text="${d.unidadMedida}"></span></td>
                            <td class="sa-cell-center sd-stock-value" th:text="${d.stockSistema}"></td>
                            <td class="sa-cell-center">
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemId'"
                                       th:value="${d.itemId}" />
                                <input type="hidden" th:name="'items[' + ${iter.index} + '].itemTipo'"
                                       th:value="${d.itemTipo}" />
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].stockFisico'"
                                       th:value="${d.stockFisico != null ? d.stockFisico : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:100px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].merma'"
                                       th:value="${d.merma != null ? d.merma : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:80px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                            <td class="sa-cell-center">
                                <input type="number" step="0.001" min="0"
                                       th:name="'items[' + ${iter.index} + '].desperdicio'"
                                       th:value="${d.desperdicio != null ? d.desperdicio : 0}"
                                       class="sd-detalle-input"
                                       style="text-align:center;max-width:80px;margin:0 auto;"
                                       placeholder="0" />
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="sd-card-actions sd-fade sd-fade--4">
            <a th:href="@{/inventario-fisico}" class="sd-btn sd-btn--outline">Cancelar</a>
            <button type="submit" class="sd-btn">
                <i class="bi bi-check2-square"></i> Guardar y revisar diferencias
            </button>
        </div>
    </form>
</div>
</body>
</html>
