<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:replace="~{fragments/layout :: layout(template=~{::template})}">
<body>
<div th:fragment="template">
    <div class="sd-page-header sd-fade sd-fade--1">
        <div>
            <h1 class="sd-page-title">Detalle Inventario F&iacute;sico</h1>
            <p class="sd-page-desc">
                <span th:text="${#temporals.format(inventario.fecha, 'dd/MM/yyyy')}"></span> &middot;
                Responsable: <strong th:text="${usuarioNombre}"></strong>
            </p>
            <div class="sd-title-accent"></div>
        </div>
        <div class="sd-page-actions">
            <a th:href="@{/inventario-fisico/{id}/excel(id=${inventario.id})}" class="sd-btn sd-btn--outline">
                <i class="bi bi-file-earmark-spreadsheet"></i> Exportar Excel
            </a>
            <a th:href="@{'/reportes/consumo?desde=' + ${inventario.fecha} + '&hasta=' + ${inventario.fecha}}"
               class="sd-btn sd-btn--outline">
                <i class="bi bi-bar-chart-line"></i> Ver consumo
            </a>
            <a th:href="@{/inventario-fisico}" class="sd-btn sd-btn--outline">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <div class="sd-info-grid sd-fade sd-fade--2">
        <div class="sd-info-card">
            <div class="sd-info-label">Estado</div>
            <div class="sd-info-value sd-info-value--accent">
                <span th:text="${inventario.estado}"></span>
            </div>
        </div>
        <div class="sd-info-card">
            <div class="sd-info-label">Items con diferencia</div>
            <div class="sd-info-value" th:text="${ajustes}"></div>
        </div>
        <div class="sd-info-card" th:if="${inventario.fechaConfirmacion != null}">
            <div class="sd-info-label">Confirmado el</div>
            <div class="sd-info-value" style="font-size:0.9rem;"
                 th:text="${#temporals.format(inventario.fechaConfirmacion, 'dd/MM/yyyy HH:mm')}"></div>
        </div>
    </div>

    <div class="sd-section-card sd-fade sd-fade--3" style="margin-top:1rem;">
        <div class="sa-table-wrapper">
            <table class="sa-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Tipo</th>
                        <th>Unidad</th>
                        <th class="sa-cell-center">Stock Sistema</th>
                        <th class="sa-cell-center">Stock F&iacute;sico</th>
                        <th class="sa-cell-center">Merma</th>
                        <th class="sa-cell-center">Desperdicio</th>
                        <th class="sa-cell-center">Dif. Inexplicada</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${detalles}" class="sd-table-row">
                        <td th:text="${d.itemNombre}"></td>
                        <td>
                            <span class="sd-item-tipo-badge"
                                  th:classappend="${d.itemTipo == 'INGREDIENTE'} ? 'sd-item-tipo-badge--ing' : 'sd-item-tipo-badge--prod'"
                                  th:text="${d.itemTipo}"></span>
                        </td>
                        <td><span class="sd-unit-badge" th:text="${d.unidadMedida}"></span></td>
                        <td class="sa-cell-center sd-stock-value" th:text="${d.stockSistema}"></td>
                        <td class="sa-cell-center sd-stock-value" th:text="${d.stockFisico}"></td>
                        <td class="sa-cell-center">
                            <span th:if="${d.merma != null and d.merma.compareTo(0) > 0}"
                                  class="sd-stock-warning" th:text="${d.merma}"></span>
                            <span th:if="${d.merma == null or d.merma.compareTo(0) == 0}"
                                  class="sd-muted" th:text="'0'"></span>
                        </td>
                        <td class="sa-cell-center">
                            <span th:if="${d.desperdicio != null and d.desperdicio.compareTo(0) > 0}"
                                  class="sd-stock-negative" th:text="${d.desperdicio}"></span>
                            <span th:if="${d.desperdicio == null or d.desperdicio.compareTo(0) == 0}"
                                  class="sd-muted" th:text="'0'"></span>
                        </td>
                        <td class="sa-cell-center">
                            <span th:if="${d.diferencia != null && d.diferencia.compareTo(0) == 0}"
                                  class="sd-muted" th:text="${d.diferencia}"></span>
                            <span th:if="${d.diferencia != null && d.diferencia.compareTo(0) > 0}"
                                  class="sd-stock-positive" th:text="'+' + ${d.diferencia}"></span>
                            <span th:if="${d.diferencia != null && d.diferencia.compareTo(0) < 0}"
                                  class="sd-stock-negative" th:text="${d.diferencia}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
