<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="es"
      th:replace="~{fragments/layout :: layout(template=~{::template})}">
<body>
<div th:fragment="template">
    <div class="sd-page-header sd-fade sd-fade--1">
        <div>
            <h1 class="sd-page-title" th:text="${producto.nombre}">Producto</h1>
            <p class="sd-page-desc">Gesti&oacute;n de receta del producto</p>
            <div class="sd-title-accent"></div>
        </div>
        <div class="sd-page-actions">
            <a th:href="@{/productos/{id}/receta/editar(id=${producto.id})}" class="sd-btn">
                <i class="bi bi-pencil"></i>
                <span th:text="${receta != null} ? 'Editar receta' : 'Crear receta'"></span>
            </a>
            <a th:href="@{/productos}" class="sd-btn sd-btn--outline">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <div class="sd-info-grid sd-fade sd-fade--2">
        <div class="sd-info-card">
            <div class="sd-info-label">Precio de venta</div>
            <div class="sd-info-value" th:text="'$' + ${#numbers.formatDecimal(producto.precioVenta, 1, 2)}">$0.00</div>
        </div>
        <div class="sd-info-card">
            <div class="sd-info-label">Tipo</div>
            <div class="sd-info-value">
                <span th:if="${producto.tieneReceta}" class="sa-badge sa-badge--recipe">Con receta</span>
                <span th:unless="${producto.tieneReceta}" class="sa-badge sa-badge--simple">Simple</span>
            </div>
        </div>
        <div class="sd-info-card" th:if="${receta != null}">
            <div class="sd-info-label">Costo de receta</div>
            <div class="sd-info-value sd-info-value--accent" th:text="'$' + ${#numbers.formatDecimal(receta.costoReceta, 1, 2)}">$0.00</div>
        </div>
        <div class="sd-info-card" th:if="${receta != null}">
            <div class="sd-info-label">Margen estimado</div>
            <div class="sd-info-value sd-info-value--accent"
                 th:text="'$' + ${#numbers.formatDecimal(producto.precioVenta - receta.costoReceta, 1, 2)}">$0.00</div>
        </div>
    </div>

    <div class="sd-list-card sd-fade sd-fade--3" th:if="${receta != null}">
        <div class="sd-list-card-glow"></div>
        <div class="sd-list-card-header">
            <div class="sd-list-card-title">
                <i class="bi bi-book"></i>
                <span th:text="${receta.nombreReceta != null ? receta.nombreReceta : 'Receta'}">Receta</span>
            </div>
        </div>

        <div class="sa-table-wrapper">
            <table class="sa-table">
                <thead>
                    <tr>
                        <th>Ingrediente</th>
                        <th>Unidad</th>
                        <th>Cantidad</th>
                        <th>Costo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="det : ${receta.detalles}" class="sd-table-row">
                        <td>
                            <div class="sd-user-name" th:text="${det.nombreIngrediente}">Ingrediente</div>
                        </td>
                        <td>
                            <span class="sd-unit-badge" th:text="${det.unidad}">UNIDAD</span>
                        </td>
                        <td>
                            <span class="sd-stock-value" th:text="${#numbers.formatDecimal(det.cantidad, 1, 3)}">0</span>
                        </td>
                        <td>
                            <span class="sd-price" th:text="'$' + ${#numbers.formatDecimal(det.costo, 1, 2)}">$0.00</span>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="sd-table-row sd-table-row--total">
                        <td colspan="3" class="sa-cell-right"><strong>Costo total:</strong></td>
                        <td><strong th:text="'$' + ${#numbers.formatDecimal(receta.costoReceta, 1, 2)}">$0.00</strong></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="sd-card-actions">
            <form th:action="@{/productos/{id}/receta/eliminar(id=${producto.id})}" method="post"
                  onsubmit="return confirm('&iquest;Eliminar la receta?')">
                <button type="submit" class="sd-btn sd-btn--danger">
                    <i class="bi bi-trash"></i> Eliminar receta
                </button>
            </form>
        </div>
    </div>

    <div class="sd-empty sd-fade sd-fade--3" th:if="${receta == null}">
        <div class="sd-empty-icon">
            <i class="bi bi-journal-x"></i>
        </div>
        <h3>Sin receta</h3>
        <p th:text="'Este producto no tiene una receta asignada.'"></p>
        <a th:href="@{/productos/{id}/receta/editar(id=${producto.id})}" class="sd-btn">
            <i class="bi bi-plus-circle"></i> Crear receta
        </a>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var els = document.querySelectorAll('.sd-fade');
            els.forEach(function(el, i) {
                setTimeout(function() {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * i);
            });
        });
    </script>
</div>
</body>
</html>
