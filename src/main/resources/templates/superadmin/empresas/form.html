<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${empresaId != null} ? 'Editar Empresa — Superadmin' : 'Nueva Empresa — Superadmin'">Superadmin — Mi Bombay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="superadmin-body">

<div class="bg-grain"></div>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<!-- NAVBAR -->
<nav class="sa-navbar">
    <div class="sa-navbar-inner">
        <a href="/superadmin/dashboard" class="sa-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <span>Panel Superadmin</span>
        </a>
        <div class="sa-navbar-end">
            <span class="sa-user-name" sec:authentication="principal.nombre"></span>
            <form th:action="@{/superadmin/logout}" method="post" class="m-0">
                <button type="submit" class="sa-btn-logout">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div class="sa-main">

    <div class="sa-header">
        <div>
            <h1 class="sa-title" th:text="${empresaId != null} ? 'Editar Empresa' : 'Nueva Empresa'">Nueva Empresa</h1>
            <p class="sa-subtitle" th:text="${empresaId != null} ? 'Modifica los datos de la empresa' : 'Registra una nueva empresa en el sistema'">Registra una nueva empresa en el sistema</p>
        </div>
        <a th:href="@{/superadmin/dashboard}" class="sa-btn sa-btn-ghost">
            <i class="bi bi-arrow-left"></i> Volver al panel
        </a>
    </div>

    <!-- ALERTS -->
    <div th:if="${#fields.hasErrors('empresa.*')}" class="sa-alert sa-alert--danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Corrige los errores del formulario.</span>
    </div>

    <div class="sa-form-card">
        <form th:action="${empresaId != null} ? @{/superadmin/empresas/{id}/actualizar(id=${empresaId})} : @{/superadmin/empresas/guardar}"
              method="post" th:object="${empresa}">

            <div class="sa-form-section">
                <h3 class="sa-form-section-title">Informaci&oacute;n b&aacute;sica</h3>
                <div class="sa-form-grid">
                    <div class="sa-form-field">
                        <label for="nombre" class="sa-form-label">Nombre de la empresa *</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="sa-form-input" placeholder="Ej: Mi Bombay Centro" required>
                        <div th:if="${#fields.hasErrors('nombre')}" class="sa-form-error" th:errors="*{nombre}"></div>
                    </div>
                    <div class="sa-form-field">
                        <label for="subdominio" class="sa-form-label">Subdominio *</label>
                        <input type="text" id="subdominio" th:field="*{subdominio}" class="sa-form-input" placeholder="Ej: centro" required>
                        <div th:if="${#fields.hasErrors('subdominio')}" class="sa-form-error" th:errors="*{subdominio}"></div>
                    </div>
                    <div class="sa-form-field">
                        <label for="nombreEncargado" class="sa-form-label">Nombre del encargado</label>
                        <input type="text" id="nombreEncargado" th:field="*{nombreEncargado}" class="sa-form-input" placeholder="Ej: Juan P&eacute;rez">
                    </div>
                    <div class="sa-form-field">
                        <label for="email" class="sa-form-label">Correo electr&oacute;nico</label>
                        <input type="email" id="email" th:field="*{email}" class="sa-form-input" placeholder="Ej: contacto@mibombay.com">
                    </div>
                </div>
            </div>

            <div class="sa-form-section">
                <h3 class="sa-form-section-title">Informaci&oacute;n de contacto</h3>
                <div class="sa-form-grid">
                    <div class="sa-form-field">
                        <label for="telefono" class="sa-form-label">Tel&eacute;fono</label>
                        <input type="text" id="telefono" th:field="*{telefono}" class="sa-form-input" placeholder="Ej: +57 300 123 4567">
                    </div>
                    <div class="sa-form-field sa-form-field--full">
                        <label for="direccion" class="sa-form-label">Direcci&oacute;n</label>
                        <input type="text" id="direccion" th:field="*{direccion}" class="sa-form-input" placeholder="Ej: Cra 10 # 20-30, Bogot&aacute;">
                    </div>
                </div>
            </div>

            <div class="sa-form-section">
                <h3 class="sa-form-section-title">Informaci&oacute;n adicional</h3>
                <div class="sa-form-grid">
                    <div class="sa-form-field sa-form-field--full">
                        <label for="descripcion" class="sa-form-label">Descripci&oacute;n</label>
                        <textarea id="descripcion" th:field="*{descripcion}" class="sa-form-input sa-form-textarea" rows="3" placeholder="Breve descripci&oacute;n de la empresa..."></textarea>
                    </div>
                </div>
            </div>

            <div class="sa-form-actions">
                <button type="submit" class="sa-btn sa-btn-primary">
                    <i class="bi bi-check-lg"></i>
                    <span th:text="${empresaId != null} ? 'Actualizar empresa' : 'Crear empresa'">Guardar</span>
                </button>
                <a th:href="@{/superadmin/dashboard}" class="sa-btn sa-btn-ghost">
                    <i class="bi bi-x-lg"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
