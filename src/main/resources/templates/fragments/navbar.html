<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      th:fragment="navbar">
<header class="sd-navbar">
    <div class="sd-navbar-inner">
        <button class="sd-navbar-toggler" id="sdSidebarToggle" type="button" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="sd-navbar-title" th:text="${empresaConfig != null ? empresaConfig.nombre() : 'Sistema'}">Sistema</div>

        <div class="sd-navbar-end">
            <span class="sd-navbar-role" sec:authentication="principal.authorities">ROL</span>
            <span class="sd-navbar-user" sec:authentication="principal.nombre">Usuario</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="sd-navbar-logout" title="Cerrar sesión">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </form>
        </div>
    </div>
</header>
</html>
