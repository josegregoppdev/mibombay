<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es"
      th:fragment="layout(template)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Bombay — Sistema de Gesti&oacute;n</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link th:href="@{'https://fonts.googleapis.com/css2?family=' + ${fontUrl} + '&display=swap'}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <th:block th:if="${temaPreset != null}">
    <style>
        :root {
            --accent: [[${temaPreset.accent}]];
            --accent-rgb: [[${temaPreset.accentRgb}]];
            --secondary: [[${temaPreset.secondary}]];
            --sidebar-bg: [[${temaPreset.sidebarBg}]];
            --sidebar-rgb: [[${temaPreset.sidebarRgb}]];
            --fondo: [[${temaPreset.fondo}]];
            --fondo-rgb: [[${temaPreset.fondoRgb}]];
            --boton: [[${temaPreset.boton}]];
            --boton-rgb: [[${temaPreset.botonRgb}]];
            --content-bg: [[${temaPreset.fondo}]];
            --content-surface: [[${temaPreset.surface}]];
            --content-surface-2: [[${temaPreset.surface2}]];
            --content-surface-hover: [[${temaPreset.surfaceHover}]];
            --content-text: [[${temaPreset.text}]];
            --content-text-secondary: [[${temaPreset.textSecondary}]];
            --content-text-muted: [[${temaPreset.textMuted}]];
            --content-text-faint: [[${temaPreset.textFaint}]];
            --content-border: [[${temaPreset.border}]];
            --content-border-strong: [[${temaPreset.borderStrong}]];
            --sidebar-text: [[${temaPreset.sidebarText}]];
            --sidebar-text-muted: [[${temaPreset.sidebarTextMuted}]];
            --sidebar-text-faint: [[${temaPreset.sidebarTextFaint}]];
            --font-heading: [[${fontHeading}]];
            --font-body: [[${fontBody}]];
            --font-size-base: [[${tamanoValor}]];
        }
        html {
            font-size: var(--font-size-base);
        }
    </style>
    </th:block>
</head>
<body class="sd-body">

<div class="sd-body-grain"></div>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="sd-sidebar-backdrop" id="sdSidebarBackdrop"></div>

<!-- Main wrapper -->
<div class="sd-main" id="sdMain">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Content -->
    <div class="sd-content">
        <div th:if="${success}" class="sd-alert sd-alert--success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="sd-alert sd-alert--danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>
        <div th:replace="${template}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
