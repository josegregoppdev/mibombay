# ============================================
# application-dev.properties
# Perfil: desarrollo
# Se sube al repo. NO contiene secretos reales.
# Para secretos personales, usa application-local.properties (gitignored)
# o variables de entorno.
# ============================================

# === DataSource ===
# Lee las credenciales de las env vars (definidas en ~/.bashrc)
# Si no existen, usa los defaults (vacíos para forzar error de config)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mibombay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# === JPA verbose (útil en dev) ===
spring.jpa.show-sql=true

# === Thymeleaf sin cache (cambios se ven al refrescar) ===
spring.thymeleaf.cache=false

# === DevTools (auto-reload al guardar) ===
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# === Logging DEBUG ===
logging.level.com.mibombay=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
