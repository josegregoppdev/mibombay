spring.application.name=sistemaresurante

# MySQL (override en application-dev.properties o variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mibombay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil}
spring.datasource.username=root
spring.datasource.password=Kristoff_Mora26123009
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# DevTools
spring.devtools.restart.enabled=true

# Logging
logging.level.com.mibombay=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Perfil activo
spring.profiles.active=dev
