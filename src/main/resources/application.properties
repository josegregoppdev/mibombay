spring.application.name=sistemaresurante

# ============================================
# Configuración base/compartida
# Los valores sensibles se sobreescriben en:
#  - application-dev.properties (desarrollo)
#  - application-prod.properties (producción)
#  - application-local.properties (secretos personales, GITIGNORED)
# O mediante variables de entorno
# ============================================

# === Server ===
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m

# === Thymeleaf ===
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# === MySQL Driver ===
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA ===
# (El dialect se detecta automáticamente en Spring Boot 3)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# === SpringDoc / Swagger ===
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# === WebSocket ===
# (configurado vía WebSocketConfig en código Java)
